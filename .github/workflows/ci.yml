name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Native runners: full lint + race + coverage + 100% gate.
  native:
    name: native-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Enforce 100% coverage
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d %)
          awk -v p="$pct" 'BEGIN { if (p+0 < 100.0) { printf "coverage is %s%%, want 100%%\n", p; exit 1 } }'

      - name: Upload coverage profile
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # Emulated runners: cross-compile per-package test binaries and run each
  # under QEMU via docker. PE/COFF is little-endian; the s390x leg is the
  # real big-endian endianness test (parser uses explicit binary.LittleEndian).
  emulated:
    name: emulated-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: rv64,v=true,vlen=128
          - arch: loong64
            goarch: loong64
            platform: linux/loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: power9
          - arch: s390x
            image: debian:trixie
            qemu_cpu: qemu
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Set up binfmt (QEMU)
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Cross-compile per-package test binaries
        env:
          GOARCH: ${{ matrix.goarch || matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p testbins
          for pkg in $(go list ./...); do
            # Skip packages with no test files.
            if [ -z "$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}yes{{end}}' "$pkg")" ]; then
              continue
            fi
            name=$(echo "$pkg" | tr '/' '_')
            CGO_ENABLED=0 GOOS=linux go test -c -cover -covermode=atomic -o "testbins/${name}.test" "$pkg"
          done
          ls -l testbins

      - name: Run test binaries under QEMU
        env:
          PLATFORM: ${{ matrix.platform || format('linux/{0}', matrix.arch) }}
          IMAGE: ${{ matrix.image }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: |
          set -euo pipefail
          status=0
          for bin in testbins/*.test; do
            echo "::group::$bin"
            if ! docker run --rm --platform "$PLATFORM" \
                -e QEMU_CPU="$QEMU_CPU" \
                -v "$PWD:/work" -w /work "$IMAGE" \
                "/work/$bin" -test.v; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
